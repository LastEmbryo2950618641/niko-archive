server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/niko-archive/niko-main;
    index index.html;

    location ~ /\. {
        deny all;
    }

    # BEGIN homepage chat
    location ^~ /chat-api/ {
        proxy_pass http://127.0.0.1:4181;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 256k;
        proxy_read_timeout 320s;
    }
    location ^~ /server/ { return 404; }
    location ^~ /test/ { return 404; }
    location ^~ /deploy/ { return 404; }
    # END homepage chat

    location = /nikowenku-archive {
        return 308 /nikowenku-archive/;
    }

    location /nikowenku-archive/api/ {
        proxy_pass http://127.0.0.1:4178/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 180m;
        proxy_read_timeout 60s;
    }

    location /nikowenku-archive/ {
        alias /srv/niko-archive/niko-wenku/dist/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # Existing open library tabs may still load the previous root assets.
    location /assets/ {
        proxy_pass http://127.0.0.1:4178;
        proxy_set_header Host $http_host;
    }

    # Preserve existing npm CLI clients that use /api at the origin.
    location /api/ {
        proxy_pass http://127.0.0.1:4178;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 180m;
        proxy_read_timeout 60s;
    }

    location /worldseed/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
